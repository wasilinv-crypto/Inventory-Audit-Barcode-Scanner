
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Barcode Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  background: #f1f5f9;
  color: #172033;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 520px;
  margin: 15px auto;
}

.card {
  background: white;
  border: 1px solid #dbe3ee;
  border-radius: 14px;
  padding: 18px;
  margin-bottom: 14px;
}

h2 { margin: 0 0 8px; }

p {
  color: #64748b;
  font-size: 14px;
}

button, select, input {
  width: 100%;
  min-height: 46px;
  border-radius: 8px;
  font-size: 15px;
  margin-top: 10px;
}

button {
  border: 0;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
  padding: 12px;
}

button.secondary {
  background: #e2e8f0;
  color: #172033;
}

button:disabled { opacity: .5; }

select, input {
  border: 1px solid #cbd5e1;
  padding: 10px;
  background: white;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 10px;
  margin-top: 12px;
}

.status {
  display: none;
  padding: 12px;
  border-radius: 8px;
  margin-top: 12px;
  overflow-wrap: anywhere;
  font-size: 14px;
}

.info {
  display: block;
  background: #dbeafe;
  color: #1e40af;
}

.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.barcode {
  font-size: 20px;
  font-weight: bold;
  word-break: break-all;
  color: #166534;
}

.small {
  font-size: 12px;
  color: #64748b;
}

</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h2>Inventory Barcode Scanner</h2>
    <p>Camera ya Gallery se barcode scan karein.</p>

    <label for="cameraSelect"><b>Select Camera</b></label>
    <select id="cameraSelect">
      <option value="">Loading cameras...</option>
    </select>

    <button id="startBtn" onclick="startCamera()">
      START CAMERA SCAN
    </button>

    <button
      class="secondary"
      id="stopBtn"
      onclick="stopCamera()"
      disabled>
      STOP CAMERA
    </button>

    <div id="reader"></div>

    <div id="cameraStatus" class="status"></div>
  </div>

  <div class="card">
    <h3>Gallery Barcode Scan</h3>
    <p>Barcode ki photo select karein.</p>

    <input
      id="galleryFile"
      type="file"
      accept="image/*"
      onchange="scanGallery(event)">

    <div id="galleryStatus" class="status"></div>
  </div>

  <div class="card">
    <h3>Scanned Barcode</h3>

    <div id="barcodeResult" class="barcode">
      Waiting for scan...
    </div>

    <button
      id="returnBtn"
      onclick="returnToApp()"
      disabled>
      RETURN TO INVENTORY APP
    </button>

    <div id="returnStatus" class="status"></div>
  </div>

  <p class="small">
    Camera access ke liye HTTPS connection aur browser permission
    zaroori hai.
  </p>

</div>

<script>
let scanner = null;
let cameras = [];
let scannedCode = '';
let scanCompleted = false;

const cameraSelect =
  document.getElementById('cameraSelect');

const params = new URLSearchParams(location.search);

const returnUrl = params.get('return');

function showStatus(id, message, type) {
  const el = document.getElementById(id);
  el.textContent = message;
  el.className = 'status ' + type;
}

function clearStatus(id) {
  const el = document.getElementById(id);
  el.textContent = '';
  el.className = 'status';
}

/* CHECK RETURN URL */
function validReturnUrl() {
  if (!returnUrl) return false;

  try {
    const url = new URL(returnUrl);

    return (
      url.protocol === 'https:' &&
      (
        url.hostname === 'script.google.com' ||
        url.hostname === 'script.googleusercontent.com'
      )
    );

  } catch (e) {
    return false;
  }
}

/* BARCODE FORMATS */
function getFormats() {
  return [
    Html5QrcodeSupportedFormats.QR_CODE,
    Html5QrcodeSupportedFormats.EAN_13,
    Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A,
    Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128,
    Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF,
    Html5QrcodeSupportedFormats.CODABAR
  ];
}

/* LOAD CAMERAS */
async function loadCameras() {
  try {
    scanner = new Html5Qrcode(
      'reader',
      {
        formatsToSupport: getFormats(),
        verbose: false
      }
    );

    cameras = await Html5Qrcode.getCameras();

    cameraSelect.innerHTML = '';

    if (!cameras.length) {
      cameraSelect.innerHTML =
        '<option value="">No camera found</option>';

      showStatus(
        'cameraStatus',
        'Camera nahi mila. Browser permission check karein.',
        'error'
      );

      return;
    }

    cameras.forEach((camera, index) => {
      const option = document.createElement('option');

      option.value = camera.id;
      option.textContent =
        camera.label || 'Camera ' + (index + 1);

      cameraSelect.appendChild(option);
    });

    // Prefer the rear/back camera on mobile.
    const rear = cameras.find(c =>
      /back|rear|environment|main/i.test(c.label || '')
    );

    if (rear) {
      cameraSelect.value = rear.id;
    }

    showStatus(
      'cameraStatus',
      cameras.length + ' camera(s) available.',
      'success'
    );

  } catch (error) {
    cameraSelect.innerHTML =
      '<option value="">Camera unavailable</option>';

    showStatus(
      'cameraStatus',
      'Camera access nahi mila. HTTPS aur camera permission check karein. ' +
      (error.message || error),
      'error'
    );
  }
}

/* START CAMERA */
async function startCamera() {
  if (scanCompleted) {
    scanCompleted = false;
    scannedCode = '';
  }

  if (!scanner) {
    showStatus(
      'cameraStatus',
      'Scanner library load nahi hui. Internet check karein.',
      'error'
    );
    return;
  }

  const cameraId = cameraSelect.value;

  if (!cameraId) {
    showStatus(
      'cameraStatus',
      'Pehle camera select karein.',
      'error'
    );
    return;
  }

  document.getElementById('startBtn').disabled = true;

  showStatus(
    'cameraStatus',
    'Camera start ho raha hai...',
    'info'
  );

  try {
    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox: function(viewWidth, viewHeight) {
          const width = Math.min(
            300,
            Math.floor(viewWidth * 0.85)
          );

          const height = Math.min(
            150,
            Math.floor(viewHeight * 0.35)
          );

          return { width, height };
        },
        aspectRatio: 1.5
      },
      function(decodedText) {
        if (scanCompleted) return;

        scanCompleted = true;
        scannedCode = String(decodedText).trim();

        document.getElementById('barcodeResult').textContent =
          scannedCode;

        document.getElementById('returnBtn').disabled = false;

        showStatus(
          'cameraStatus',
          'Barcode successfully scanned!',
          'success'
        );

        stopCamera(false);

        setTimeout(returnToApp, 700);
      },
      function() {
        // Normal scanning: no barcode found in this frame.
      }
    );

    document.getElementById('stopBtn').disabled = false;

    showStatus(
      'cameraStatus',
      'Camera active. Barcode ko frame mein rakhein.',
      'info'
    );

  } catch (error) {
    document.getElementById('startBtn').disabled = false;

    showStatus(
      'cameraStatus',
      'Camera start nahi hua: ' +
      (error.message || error),
      'error'
    );
  }
}

/* STOP CAMERA */
async function stopCamera(showMessage = true) {
  try {
    if (scanner && scanner.isScanning) {
      await scanner.stop();
    }

    document.getElementById('stopBtn').disabled = true;
    document.getElementById('startBtn').disabled = false;

    if (showMessage) {
      showStatus(
        'cameraStatus',
        'Camera stopped.',
        'info'
      );
    }

  } catch (error) {
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
  }
}

/* GALLERY IMAGE SCAN */
async function scanGallery(event) {
  const file = event.target.files[0];

  if (!file) return;

  if (!scanner) {
    showStatus(
      'galleryStatus',
      'Scanner library load nahi hui. Internet check karein.',
      'error'
    );
    return;
  }

  showStatus(
    'galleryStatus',
    'Photo scan ho rahi hai...',
    'info'
  );

  try {
    const code = await scanner.scanFile(file, true);

    scannedCode = String(code).trim();
    scanCompleted = true;

    document.getElementById('barcodeResult').textContent =
      scannedCode;

    document.getElementById('returnBtn').disabled = false;

    showStatus(
      'galleryStatus',
      'Gallery barcode successfully scanned!',
      'success'
    );

    setTimeout(returnToApp, 700);

  } catch (error) {
    showStatus(
      'galleryStatus',
      'Photo mein readable barcode nahi mila. Clear photo try karein.',
      'error'
    );

  } finally {
    event.target.value = '';
  }
}

/* SEND BARCODE TO ORIGINAL APP */
function returnToApp() {
  if (!scannedCode) {
    showStatus(
      'returnStatus',
      'Pehle barcode scan karein.',
      'error'
    );
    return;
  }

  if (!validReturnUrl()) {
    showStatus(
      'returnStatus',
      'Inventory App return link valid nahi hai.',
      'error'
    );
    return;
  }

  if (window.opener && !window.opener.closed) {
    try {
      window.opener.postMessage(
        {
          type: 'INVENTORY_BARCODE',
          barcode: scannedCode
        },
        '*'
      );

      showStatus(
        'returnStatus',
        'Barcode Inventory App ko bhej diya gaya.',
        'success'
      );

      setTimeout(function() {
        window.close();
      }, 700);

    } catch (error) {
      showStatus(
        'returnStatus',
        'Barcode return nahi ho paya. Original app tab check karein.',
        'error'
      );
    }

  } else {
    showStatus(
      'returnStatus',
      'Original Inventory App tab nahi mila. Barcode: ' +
      scannedCode,
      'error'
    );
  }
}

/* INITIALIZE */
window.addEventListener('load', function() {
  if (!validReturnUrl()) {
    showStatus(
      'cameraStatus',
      'Inventory App return URL missing ya invalid hai.',
      'error'
    );
  }

  loadCameras();
});
</script>

</body>
</html>
