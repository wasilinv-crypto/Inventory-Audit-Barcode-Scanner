
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Barcode Scanner</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f1f5f9;font-family:Arial,sans-serif;color:#172033}
.app{max-width:520px;margin:20px auto;background:white;padding:20px;border-radius:18px}
h2{text-align:center}
video{width:100%;min-height:260px;background:#101828;border-radius:12px;object-fit:cover}
button{width:100%;padding:16px;margin-top:14px;border:0;border-radius:10px;background:#2563eb;color:white;font-size:18px;font-weight:bold}
#stop{background:#475569}
#status{padding:14px;margin-top:15px;border-radius:8px;background:#eff6ff;overflow-wrap:anywhere}
#result{font-size:22px;font-weight:bold;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
<h2>Inventory Barcode Scanner</h2>
<video id="video" muted playsinline></video>
<button id="start">START CAMERA / SCAN</button>
<button id="stop">STOP CAMERA</button>
<div id="status">Press START CAMERA to begin.</div>
<p>Scanned Barcode:</p>
<div id="result">Not scanned</div>
</div>

<script>
const video=document.getElementById("video");
const statusBox=document.getElementById("status");
const resultBox=document.getElementById("result");
const params=new URLSearchParams(location.search);
const returnUrl=params.get("return");

let stream=null;
let detector=null;
let scanning=false;
let busy=false;

function status(message){
  statusBox.textContent=message;
}

async function stopCamera(){
  scanning=false;
  if(stream){
    stream.getTracks().forEach(track=>track.stop());
    stream=null;
  }
  video.srcObject=null;
}

async function startCamera(){
  if(scanning)return;

  if(!window.isSecureContext){
    status("HTTPS connection required. Open the GitHub Pages HTTPS link.");
    return;
  }

  if(!("BarcodeDetector" in window)){
    status("Your Chrome does not support built-in Barcode Detection. Please update Chrome.");
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status("Camera API is not available in this browser.");
    return;
  }

  try{
    status("Starting camera...");
    const supported=await BarcodeDetector.getSupportedFormats();
    const wanted=[
      "ean_13","ean_8","upc_a","upc_e",
      "code_128","code_39","itf","codabar","qr_code"
    ];
    const formats=wanted.filter(f=>supported.includes(f));

    if(!formats.length){
      status("No supported barcode formats found in Chrome.");
      return;
    }

    detector=new BarcodeDetector({formats});

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{facingMode:{ideal:"environment"}}
    });

    video.srcObject=stream;
    await video.play();

    scanning=true;
    status("Camera ready. Barcode ko camera ke saamne rakhein.");
    scanLoop();

  }catch(error){
    await stopCamera();

    if(error.name==="NotAllowedError" || error.name==="PermissionDeniedError"){
      status("Camera permission denied by browser.");
    }else if(error.name==="NotFoundError"){
      status("Camera not found.");
    }else if(error.name==="NotReadableError"){
      status("Camera is busy. Close other camera apps.");
    }else{
      status("Scanner error: "+error.name+" - "+error.message);
    }
  }
}

async function scanLoop(){
  if(!scanning || busy)return;
  busy=true;

  try{
    if(video.readyState>=2 && detector){
      const codes=await detector.detect(video);

      if(codes.length){
        const barcode=codes[0].rawValue;
        resultBox.textContent=barcode;
        await stopCamera();
        status("Barcode successfully scanned!");

        if(returnUrl){
          try{
            const target=new URL(returnUrl);
            if(target.hostname!=="script.google.com" &&
               target.hostname!=="script.googleusercontent.com"){
              status("Invalid return URL.");
              return;
            }
            target.searchParams.set("scan",barcode);
            location.href=target.toString();
          }catch(e){
            status("Return URL is invalid.");
          }
        }
        return;
      }
    }
  }catch(error){
    status("Reading barcode... Keep barcode steady.");
  }

  busy=false;
  if(scanning)setTimeout(scanLoop,150);
}

document.getElementById("start").addEventListener("click",startCamera);
document.getElementById("stop").addEventListener("click",async()=>{
  await stopCamera();
  status("Camera stopped.");
});

window.addEventListener("pagehide",stopCamera);
</script>
</body>
</html>
