
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Barcode Scanner</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:18px;background:#f1f5f9;
  font-family:Arial,sans-serif;color:#172033
}
.app{
  max-width:520px;margin:20px auto;background:white;
  padding:20px;border-radius:18px
}
h2{text-align:center}
video{
  width:100%;min-height:250px;background:#101828;
  border-radius:12px;object-fit:cover
}
button,.gallery{
  display:block;width:100%;padding:16px;margin-top:14px;
  border:0;border-radius:10px;background:#2563eb;
  color:white;font-size:17px;font-weight:bold;
  text-align:center;cursor:pointer
}
#stop{background:#475569}
.gallery{background:#0f766e}
#status{
  padding:14px;margin-top:15px;border-radius:8px;
  background:#eff6ff;overflow-wrap:anywhere
}
#result{
  font-size:22px;font-weight:bold;overflow-wrap:anywhere
}
#file{display:none}
</style>
</head>

<body>
<div class="app">

<h2>Inventory Barcode Scanner</h2>

<video id="video" muted playsinline></video>

<button id="start">📷 LIVE CAMERA SCAN</button>
<button id="stop">STOP CAMERA</button>

<label class="gallery" for="file">
🖼️ SCAN FROM GALLERY
</label>

<input id="file" type="file" accept="image/*">

<div id="status">Choose camera or gallery to scan.</div>

<p>Scanned Barcode:</p>
<div id="result">Not scanned</div>

</div>

<script>
const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const resultBox = document.getElementById("result");
const fileInput = document.getElementById("file");

const params = new URLSearchParams(location.search);
const returnUrl = params.get("return");

let stream = null;
let detector = null;
let scanning = false;
let busy = false;

function status(message) {
  statusBox.textContent = message;
}

async function getDetector() {

  if (!("BarcodeDetector" in window)) {
    throw new Error(
      "Barcode Detection supported nahi hai. Chrome update karein."
    );
  }

  const supported = await BarcodeDetector.getSupportedFormats();

  const wanted = [
    "ean_13","ean_8","upc_a","upc_e",
    "code_128","code_39","itf","codabar","qr_code"
  ];

  const formats = wanted.filter(f => supported.includes(f));

  if (!formats.length) {
    throw new Error("No supported barcode formats found.");
  }

  return new BarcodeDetector({formats});
}


// BARCODE KO PURANE APP TAB MEIN BHEJNA
function sendBarcode(code) {

  code = String(code || "").trim();

  if (!code) return;

  resultBox.textContent = code;

  if (!returnUrl) {
    status("Return URL missing.");
    return;
  }

  let target;

  try {
    target = new URL(returnUrl);

    if (
      target.hostname !== "script.google.com" &&
      target.hostname !== "script.googleusercontent.com"
    ) {
      throw new Error("Invalid return URL.");
    }

  } catch (e) {
    status("Invalid Inventory App URL.");
    return;
  }

  // Original Inventory App tab ko barcode bhejo
  if (window.opener && !window.opener.closed) {

    window.opener.postMessage({
      type: "INVENTORY_BARCODE",
      barcode: code
    }, "*");

    status("Barcode Inventory App ko bhej diya gaya.");

    setTimeout(() => {
      window.close();
    }, 700);

  } else {

    status(
      "Original Inventory App tab nahi mila. " +
      "Scanner ko Inventory App ke SCAN button se kholein."
    );

  }
}


// STOP CAMERA
async function stopCamera() {

  scanning = false;
  busy = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;
}


// START CAMERA
async function startCamera() {

  if (scanning) return;

  try {

    if (!window.isSecureContext) {
      throw new Error("HTTPS required.");
    }

    detector = await getDetector();

    status("Starting camera...");

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: {ideal:"environment"}
      }
    });

    video.srcObject = stream;

    await video.play();

    scanning = true;
    busy = false;

    status("Camera ready. Barcode ko camera ke saamne rakhein.");

    scanLoop();

  } catch (error) {

    await stopCamera();

    status(error.message || error.name);

  }
}


// CAMERA SCAN LOOP
async function scanLoop() {

  if (!scanning || busy) return;

  busy = true;

  try {

    if (video.readyState >= 2 && detector) {

      const codes = await detector.detect(video);

      if (codes.length && codes[0].rawValue) {

        const code = codes[0].rawValue;

        await stopCamera();

        sendBarcode(code);

        return;
      }
    }

  } catch (e) {}

  busy = false;

  if (scanning) {
    setTimeout(scanLoop, 180);
  }
}


// GALLERY SCAN
async function scanGallery(file) {

  if (!file) return;

  await stopCamera();

  resultBox.textContent = "Scanning image...";
  status("Gallery image scanning...");

  try {

    if (!window.isSecureContext) {
      throw new Error("HTTPS required.");
    }

    detector = await getDetector();

    const bitmap = await createImageBitmap(file);

    try {

      const codes = await detector.detect(bitmap);

      if (codes.length && codes[0].rawValue) {

        sendBarcode(codes[0].rawValue);

      } else {

        resultBox.textContent = "Not found";

        status(
          "Barcode nahi mila. Clear aur seedhi photo select karein."
        );

      }

    } finally {

      bitmap.close();

    }

  } catch (error) {

    resultBox.textContent = "Scan failed";

    status(error.message || "Image scan failed.");

  }

  fileInput.value = "";
}


// BUTTON EVENTS
document.getElementById("start")
  .addEventListener("click", startCamera);

document.getElementById("stop")
  .addEventListener("click", async () => {

    await stopCamera();

    status("Camera stopped.");

  });

fileInput.addEventListener("change", () => {

  const file = fileInput.files && fileInput.files[0];

  if (file) scanGallery(file);

});

window.addEventListener("pagehide", stopCamera);

</script>
</body>
</html>
